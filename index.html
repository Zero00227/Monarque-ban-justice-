<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Monarque Ban Justice</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://googleapis.com" rel="stylesheet" />
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #121212;
            --neon-red: #ff0000;
            --neon-green: #00ff66;
            --text: #e0e0e0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "JetBrains Mono", monospace;
            background: radial-gradient(circle at top, #1a1a1a, #050505);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .panel {
            width: 400px;
            background: linear-gradient(180deg, #151515, #0a0a0a);
            border: 2px solid var(--neon-red);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5), 
                        0 0 60px rgba(255, 0, 0, 0.3),
                        inset 0 0 20px rgba(255, 0, 0, 0.1);
            animation: neon-border-pulse 3s infinite ease-in-out;
        }

        @keyframes neon-border-pulse {
            0%, 100% {
                border-color: var(--neon-red);
                box-shadow: 0 0 30px rgba(255, 0, 0, 0.6), 
                            0 0 60px rgba(255, 0, 0, 0.4),
                            inset 0 0 20px rgba(255, 0, 0, 0.2);
            }
            50% {
                border-color: var(--neon-green);
                box-shadow: 0 0 30px rgba(0, 255, 102, 0.6), 
                            0 0 60px rgba(0, 255, 102, 0.4),
                            inset 0 0 20px rgba(0, 255, 102, 0.2);
            }
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            /* Nouvelle URL d'avatar Sung Jin-woo directe et stable */
            background: url("https://pfps.gg") center/cover no-repeat;
            border: 2px solid var(--neon-red);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8), 
                        0 0 40px rgba(255, 0, 0, 0.5);
            animation: avatar-glow 3s infinite ease-in-out;
        }

        @keyframes avatar-glow {
            0%, 100% {
                border-color: var(--neon-red);
                box-shadow: 0 0 20px rgba(255, 0, 0, 0.8), 0 0 40px rgba(255, 0, 0, 0.5);
            }
            50% {
                border-color: var(--neon-green);
                box-shadow: 0 0 20px rgba(0, 255, 102, 0.8), 0 0 40px rgba(0, 255, 102, 0.5);
            }
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 24px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(255, 0, 0, 0.8), 
                         0 0 20px rgba(255, 0, 0, 0.5);
            animation: text-glow 3s infinite ease-in-out;
        }

        @keyframes text-glow {
            0%, 100% {
                text-shadow: 0 0 10px rgba(255, 0, 0, 0.8), 0 0 20px rgba(255, 0, 0, 0.5);
            }
            50% {
                text-shadow: 0 0 10px rgba(0, 255, 102, 0.8), 0 0 20px rgba(0, 255, 102, 0.5);
            }
        }

        .sub {
            text-align: center;
            font-size: 11px;
            opacity: 0.8;
            margin: 8px 0 20px;
            color: #888;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: #0f0f0f;
            border: 1px solid #333;
            color: var(--text);
            margin-bottom: 15px;
            font-family: "JetBrains Mono", monospace;
            font-size: 13px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--neon-red);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }

        .btns {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 2px solid var(--neon-red);
            background: rgba(255, 0, 0, 0.1);
            color: #fff;
            font-family: "JetBrains Mono", monospace;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: button-pulse 2s infinite ease-in-out;
            transition: all 0.3s ease;
        }

        button:hover {
            background: rgba(255, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        @keyframes button-pulse {
            0%, 100% {
                box-shadow: 0 0 10px rgba(255, 0, 0, 0.5), 
                            0 0 20px rgba(255, 0, 0, 0.3);
                border-color: var(--neon-red);
            }
            50% {
                box-shadow: 0 0 10px rgba(0, 255, 102, 0.5), 
                            0 0 20px rgba(0, 255, 102, 0.3);
                border-color: var(--neon-green);
            }
        }

        .progress-container {
            width: 100%;
            height: 16px;
            background: #1a1a1a;
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--neon-red), var(--neon-green));
            border-radius: 12px;
            transition: width 0.2s ease;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
        }

        .logs {
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 15px;
            min-height: 180px;
            font-size: 14px;
            line-height: 1.6;
            color: #00ff66;
            overflow-y: auto;
            max-height: 200px;
            font-family: "JetBrains Mono", monospace;
        }

        .log {
            animation: fadeIn 0.4s ease;
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
        }

        .done {
            color: var(--neon-green);
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.8);
        }

        .footer {
            text-align: center;
            margin-top: 18px;
            font-size: 10px;
            opacity: 0.6;
            color: #555;
            letter-spacing: 1px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="avatar"></div>
        <h1>Monarque Ban Justice</h1>
        <div class="sub">WHATSAPP REPORT SYSTEM</div>
        <input id="number" placeholder="Numéro WhatsApp à signaler" />
        <div class="btns">
            <button id="signalBtn">SIGNALER</button>
        </div>
        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <div class="logs" id="logs">
            <div class="log">[MONARQUE] init::0x9fa3c4</div>
        </div>
        <div class="footer">Powered by MONARQUE</div>
    </div>
    <audio id="sound" src="https://catbox.moe"></audio>

    <script>
        const logs = document.getElementById("logs");
        const signalBtn = document.getElementById("signalBtn");
        const progressBar = document.getElementById("progressBar");
        const sound = document.getElementById("sound");

        const logPool = [
            "[MONARQUE] payload.inject()",
            "[MONARQUE] connecting_to_whatsapp_server...",
            "[MONARQUE] sending_spam_reports...",
            "[MONARQUE] bypass_security_check...",
            "[MONARQUE] target_account_flagged!"
        ];

        signalBtn.addEventListener("click", () => {
            const inputVal = document.getElementById("number").value.trim();
            if(!inputVal) return alert("Veuillez entrer un numéro");
            
            signalBtn.disabled = true;
            let currentProgress = 0;
            
            if(sound) sound.play().catch(() => {});

            const interval = setInterval(() => {
                currentProgress += 5;
                progressBar.style.width = currentProgress + "%";
                
                if (currentProgress % 20 === 0 && logPool.length > 0) {
                    const randomLog = logPool[Math.floor(Math.random() * logPool.length)];
                    const newLog = document.createElement("div");
                    newLog.className = "log";
                    newLog.innerText = randomLog;
                    logs.appendChild(newLog);
                    logs.scrollTop = logs.scrollHeight;
                }

                if (currentProgress >= 100) {
                    clearInterval(interval);
                    const finalLog = document.createElement("div");
                    finalLog.className = "log done";
                    finalLog.innerText = "[MONARQUE] PROCESS DONE. REPORTS SENT SUCCESSFULLY.";
                    logs.appendChild(finalLog);
                    logs.scrollTop = logs.scrollHeight;
                    signalBtn.disabled = false;
                }
            }, 200);
        });
    </script>
</body>
</html>
