<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Monarque Ban Justice</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://googleapis.com" rel="stylesheet" />
    <style>
        :root {
            --bg: #030308;
            --glass: rgba(10, 10, 25, 0.7);
            --border-glow: #7000ff;
            --accent-cyan: #00f3ff;
            --accent-purple: #9d00ff;
            --text-main: #ffffff;
            --text-muted: #6c6c85;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(157, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(0, 243, 255, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Arrière-plan technologique animé */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
            z-index: 0;
            pointer-events: none;
        }

        .hud-container {
            position: relative;
            width: 100%;
            max-width: 440px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(157, 0, 255, 0.3);
            border-radius: 24px;
            padding: 40px 24px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            z-index: 1;
        }

        /* Avatar asymétrique style HUD d'anime */
        .character-badge {
            position: absolute;
            top: -45px;
            left: 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar {
            width: 84px;
            height: 84px;
            border-radius: 18px;
            background: url("https://pfps.gg") center/cover no-repeat;
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
            transform: rotate(-3deg);
            transition: transform 0.3s ease;
        }

        .hud-container:hover .avatar {
            transform: rotate(0deg) scale(1.05);
        }

        .status-pill {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--accent-cyan);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--accent-cyan);
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        header {
            margin-top: 30px;
            margin-bottom: 30px;
        }

        h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: 18px;
            margin: 0;
            letter-spacing: -0.5px;
            background: linear-gradient(45deg, var(--text-main), #b8b8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-purple);
            letter-spacing: 3px;
            margin-top: 6px;
            text-transform: uppercase;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(108, 108, 133, 0.3);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 20px rgba(157, 0, 255, 0.2), inset 0 0 10px rgba(0,0,0,0.5);
            background: rgba(0, 0, 0, 0.6);
        }

        /* Bouton biseauté futuriste */
        button {
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--accent-purple) 0%, #5000b8 100%);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(157, 0, 255, 0.3);
            transition: all 0.3s ease;
            margin-bottom: 24px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.6s ease;
        }

        button:hover::before {
            left: 100%;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #222230;
            box-shadow: none;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* Barre de progression épurée */
        .progress-container {
            width: 100%;
            height: 6px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-cyan));
            box-shadow: 0 0 10px var(--accent-cyan);
            transition: width 0.2s ease;
        }

        /* Console de Logs Style Hologramme */
        .logs-window {
            background: rgba(3, 3, 8, 0.8);
            border: 1px solid rgba(108, 108, 133, 0.2);
            border-radius: 16px;
            padding: 20px;
            min-height: 160px;
            max-height: 160px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.8;
            color: #a5a5cc;
            overflow-y: auto;
        }

        .log-row {
            display: flex;
            gap: 8px;
            animation: slideIn 0.3s ease forwards;
        }

        .log-time {
            color: var(--accent-cyan);
            opacity: 0.7;
        }

        .log-text {
            color: var(--text-main);
        }

        .log-success {
            color: var(--accent-cyan);
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 24px;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-5px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div class="hud-container">
        <!-- Badge Avatar Excentré -->
        <div class="character-badge">
            <div class="avatar"></div>
            <div class="status-pill" id="statusPill">En ligne</div>
        </div>

        <header>
            <h1>Monarque Ban Justice</h1>
            <div class="sub">System Protocol</div>
        </header>

        <div class="input-wrapper">
            <input id="number" placeholder="Identifiant ou numéro cible..." autocomplete="off" />
        </div>

        <button id="signalBtn">Exécuter le protocole</button>

        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="logs-window" id="logs">
            <div class="log-row">
                <span class="log-time">[00:00]</span>
                <span class="log-text">SYSTEM_READY :: En attente d'initialisation...</span>
            </div>
        </div>

        <footer>Core System v4.0</footer>
    </div>

    <audio id="sound" src="https://catbox.moe"></audio>

    <script>
        const logs = document.getElementById("logs");
        const signalBtn = document.getElementById("signalBtn");
        const progressBar = document.getElementById("progressBar");
        const statusPill = document.getElementById("statusPill");
        const sound = document.getElementById("sound");

        const logPool = [
            "Injection des paquets de données en cours...",
            "Tentative de contournement du pare-feu...",
            "Synchronisation avec la passerelle principale...",
            "Génération du jeton d'authentification...",
            "Alerte de sécurité contournée avec succès."
        ];

        function getTimestamp() {
            const now = new Date();
            return `[${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}]`;
        }

        signalBtn.addEventListener("click", () => {const inputVal = document.getElementById("number").value.trim();if(!inputVal) return alert("Veuillez saisir une cible valide.");signalBtn.disabled = true;statusPill.innerText = "Traitement";statusPill.style.color = "#ff007f";statusPill.style.borderColor = "#ff007f";statusPill.style.boxShadow = "0 0 10px rgba(255, 0, 127, 0.2)";let currentProgress = 0;if(sound) sound.play().catch(() => {});const interval = setInterval(() => {currentProgress += 4;progressBar.style.width = currentProgress + "%";if (currentProgress % 20 === 0 && logPool.length > 0) {const randomText = logPool[Math.floor(Math.random() * logPool.length)];const row = document.createElement("div");row.className = "log-row";row.innerHTML = <span class="log-time">${getTimestamp()}</span><span class="log-text">${randomText}</span>;logs.appendChild(row);logs.scrollTop = logs.scrollHeight;}if (currentProgress >= 100) {clearInterval(interval);const finalRow = document.createElement("div");finalRow.className = "log-row";finalRow.innerHTML = <span class="log-time">${getTimestamp()}</span><span class="log-success">» PROTOCOLE TERMINÉ AVEC SUCCÈS.</span>;logs.appendChild(finalRow);logs.scrollTop = logs.scrollHeight;statusPill.innerText = "Terminé";statusPill.style.color = "var(--accent-cyan)";statusPill.style.borderColor = "var(--accent-cyan)";signalBtn.disabled = false;}}, 150);});
